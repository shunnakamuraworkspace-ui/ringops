name: Focused CI autofix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-autofix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix lint issues
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('features/matchmaking/components/case-board.tsx')
          s = p.read_text()
          s = s.replace('import { useEffect, useState } from "react";\n', 'import { useEffect, useState } from "react";\nimport { useRouter } from "next/navigation";\n')
          s = s.replace('export function CaseBoard({ databaseConnected, industryMode }: { databaseConnected:boolean; industryMode:boolean }) {\n', 'export function CaseBoard({ databaseConnected, industryMode }: { databaseConnected:boolean; industryMode:boolean }) {\n  const router=useRouter();\n')
          s = s.replace('window.location.href="/open-matches?fromCase=1";', 'router.push("/open-matches?fromCase=1");')
          s = s.replace('window.location.href=`/open-matches?reopened=${encodeURIComponent(String(data))}`;', 'router.push(`/open-matches?reopened=${encodeURIComponent(String(data))}`);')
          p.write_text(s)

          p = Path('features/open-matches/components/open-match-board.tsx')
          s = p.read_text().replace('id:`demo-${Date.now()}`', 'id:`demo-${items.length + 1}`')
          p.write_text(s)

          p = Path('features/boxers/components/candidate-list.tsx')
          s = p.read_text().replace('ids.map((id,index)=>previewBoxers.find', 'ids.map((id)=>previewBoxers.find')
          p.write_text(s)

          p = Path('postcss.config.mjs')
          p.write_text('const config = { plugins: { tailwindcss: {}, autoprefixer: {} } };\n\nexport default config;\n')
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/matchmaking/components/case-board.tsx features/open-matches/components/open-match-board.tsx features/boxers/components/candidate-list.tsx postcss.config.mjs
          git commit -m "fix: resolve CI lint errors"
          git push
