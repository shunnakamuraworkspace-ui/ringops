name: Publish RINGOPS Preview

# PR verification enabled so deployment failures are observable.
on:
  push:
    branches: [main]
    paths:
      - "public/ringops-preview.html"
      - ".github/workflows/pages-preview.yml"
  pull_request:
    branches: [main]
    paths:
      - "public/ringops-preview.html"
      - ".github/workflows/pages-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare preview artifact
        run: |
          mkdir -p .pages
          cp public/ringops-preview.html .pages/index.html
          touch .pages/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
