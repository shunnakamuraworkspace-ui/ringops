name: One-off install Playwright

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --save-dev @playwright/test@1.55.0
      - name: Add browser tests
        run: |
          mkdir -p e2e
          cat > playwright.config.ts <<'EOF'
          import { defineConfig, devices } from "@playwright/test";

          export default defineConfig({
            testDir: "./e2e",
            timeout: 30_000,
            retries: 1,
            use: {
              baseURL: "http://127.0.0.1:3000",
              trace: "retain-on-failure",
            },
            projects: [{ name: "chromium", use: { ...devices["Desktop Chrome"] } }],
            webServer: {
              command: "npm start",
              url: "http://127.0.0.1:3000",
              reuseExistingServer: false,
              timeout: 60_000,
            },
          });
          EOF
          cat > e2e/review-flow.spec.ts <<'EOF'
          import { expect, test } from "@playwright/test";

          test("competition and overseas directory filters work", async ({ page }) => {
            await page.goto("/");
            await page.getByRole("link", { name: "女子", exact: true }).click();
            await expect(page).toHaveURL(/competition=women/);
            await expect(page.getByText("藤本 美咲", { exact: true })).toBeVisible();
            await expect(page.getByText("山田 直樹", { exact: true })).toHaveCount(0);

            await page.goto("/?competition=men");
            await page.getByLabel("選手を検索").fill("マルコ");
            await expect(page.getByText("マルコ・サントス", { exact: true })).toBeVisible();
          });

          test("candidate save and consultation create a local review case", async ({ page }) => {
            const boxerId = "20000000-0000-0000-0000-000000000007";
            await page.goto(`/boxers/${boxerId}`);
            await page.getByRole("button", { name: "候補に保存" }).first().click();
            await page.goto("/candidates");
            await expect(page.getByText("藤本 美咲", { exact: true })).toBeVisible();

            await page.goto(`/matchmaking/new?boxer=${boxerId}`);
            await page.getByLabel("興行名").fill("E2E TEST EVENT");
            await page.getByLabel("希望日").fill("2026-12-12");
            await page.getByLabel("会場").fill("後楽園ホール");
            await page.getByLabel("契約ウェイト（kg）").fill("50.5");
            await page.getByLabel("相談内容").fill("E2E確認用の相談です");
            await page.getByRole("button", { name: "所属ジムへ相談を開始" }).click();
            await expect(page.getByText("相談を案件に登録しました", { exact: true })).toBeVisible();
            await page.getByRole("button", { name: "マッチメイク案件を見る" }).click();
            await expect(page.getByText(/藤本 美咲/)).toBeVisible();
          });

          test("event bout conditions carry into open match form", async ({ page }) => {
            await page.goto("/events");
            await page.getByRole("button", { name: "対戦枠を追加" }).first().click();
            await page.getByLabel("競技区分").selectOption({ label: "女子" });
            await page.getByLabel("階級").selectOption({ label: "フライ級" });
            await page.getByLabel("契約kg").fill("50.5");
            await page.getByLabel("予定R").selectOption("6");
            await page.getByRole("button", { name: "この対戦枠を追加" }).click();

            const row = page.locator("div").filter({ hasText: "女子｜フライ級" }).filter({ has: page.getByRole("link", { name: "この条件で募集" }) }).last();
            await row.getByRole("link", { name: "この条件で募集" }).click();
            await expect(page).toHaveURL(/\/open-matches\?.*competition=women/);
            await expect(page.getByText("興行の対戦枠から条件を引き継ぎました", { exact: false })).toBeVisible();
            await expect(page.getByLabel("競技区分")).toHaveValue("女子");
            await expect(page.getByLabel("階級")).toHaveValue("フライ級");
            await expect(page.getByLabel("契約ウェイト 下限 kg")).toHaveValue("50.5");
          });
          EOF
      - name: Update CI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/ci.yml')
          s=path.read_text()
          s=s.replace('timeout-minutes: 12','timeout-minutes: 20')
          marker='      - name: Smoke test production server\n'
          insert='      - name: Install Chromium for browser tests\n        run: npx playwright install --with-deps chromium\n      - name: Browser workflow tests\n        run: npx playwright test\n'
          if insert not in s:
              pos=s.index(marker)
              s=s[:pos]+insert+s[pos:]
          path.write_text(s)
          PY
      - run: rm .github/workflows/oneoff-install-playwright.yml
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json playwright.config.ts e2e/review-flow.spec.ts .github/workflows/ci.yml .github/workflows/oneoff-install-playwright.yml
          git commit -m "test: add browser workflow tests"
          git push
