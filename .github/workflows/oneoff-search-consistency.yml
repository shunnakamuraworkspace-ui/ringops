name: One-off search consistency patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-search-consistency.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch search consistency
        run: |
          python - <<'PY'
          from pathlib import Path

          directory = Path("features/boxers/components/boxer-directory.tsx")
          text = directory.read_text()
          old = '''      const scopeOk =\n        scope === "すべて" ||\n        (scope === "国内" ? boxer.nationality === "日本" : boxer.nationality !== "日本");'''
          new = '''      const boxerScope = boxer.domesticOrInternational ?? (boxer.nationality === "日本" ? "国内" : "海外");\n      const scopeOk = scope === "すべて" || boxerScope === scope;'''
          if old not in text:
              raise SystemExit("scope search target not found")
          directory.write_text(text.replace(old, new))

          open_match = Path("features/open-matches/components/open-match-board.tsx")
          text = open_match.read_text()
          old = 'const divisionCodes:Record<string,string>={"ミニマム級":"minimum"'
          new = 'const divisionCodes:Record<string,string>={"アトム級":"atom","ミニマム級":"minimum"'
          if old not in text:
              raise SystemExit("division map target not found")
          open_match.write_text(text.replace(old, new))
          PY
      - name: Commit patch
        run: |
          git config user.name "RINGOPS CI"
          git config user.email "actions@users.noreply.github.com"
          git add features/boxers/components/boxer-directory.tsx features/open-matches/components/open-match-board.tsx
          git commit -m "fix: align overseas search and atomweight open matches"
          git push
