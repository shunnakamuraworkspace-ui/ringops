<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TREASURE BOXING PROMOTION Ticket Operations Review</title>
<style>
:root{--bg:#0a0a0a;--ink:#1c1917;--gold:#c9a227;--gold2:#e6c85c;--paper:#fff;--muted:#f7f7f5;--line:#dedbd6;--stone:#78716c;--red:#b42318;--green:#18794e;--blue:#175cd3}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP","Segoe UI",sans-serif;background:var(--bg);color:#fafaf9}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{max-width:1000px;margin:0 auto;padding:28px 18px 60px}.brand{border:1px solid rgba(201,162,39,.4);border-radius:16px;background:#101010;overflow:hidden}.brand-top{padding:15px 22px;border-bottom:1px solid rgba(230,200,92,.22);font-size:12px;font-weight:900;letter-spacing:.14em;color:#e6c85c}.brand-body{padding:32px 22px}.brand-body .small{font-size:14px;color:#d6d3d1;font-weight:700}.brand h1{font-size:clamp(32px,5vw,52px);line-height:1.08;margin:7px 0 12px}.brand p{color:#d6d3d1;line-height:1.8;margin:0}.surface{margin-top:16px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.16)}.surface-head{padding:19px 22px;border-bottom:1px solid #e7e5e4}.surface-head .kicker{font-size:13px;color:#78716c;font-weight:900}.surface-head h2{font-size:25px;margin:4px 0 0}.roles{display:grid;grid-template-columns:repeat(3,1fr)}.role{appearance:none;border:0;border-right:1px solid #e7e5e4;background:#fff;text-align:left;padding:24px;min-height:190px;color:#1c1917}.role:last-child{border-right:0}.role:hover{background:#fafaf9}.role .num{font-size:12px;color:#9a7414;font-weight:900;letter-spacing:.12em}.role h3{font-size:27px;margin:26px 0 6px}.role p{font-size:14px;color:#57534e;line-height:1.7}.role .arr{display:block;margin-top:18px;font-size:20px;color:#9a7414;font-weight:900}.review-note{margin-top:14px;border:1px solid #e7e5e4;border-radius:14px;background:#f7f7f5;padding:16px 18px;color:#44403c;font-size:13px;line-height:1.7}
.app{min-height:100vh;background:#f3f2ef;color:#1c1917}.top{height:64px;background:#0d0d0d;color:#fff;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid rgba(201,162,39,.35);position:sticky;top:0;z-index:20}.wordmark{font-size:13px;font-weight:900;letter-spacing:.11em;color:#e6c85c}.top-center{margin-left:28px;font-size:14px;font-weight:800;color:#d6d3d1}.top-spacer{flex:1}.role-switch{display:flex;gap:4px}.role-switch button{border:1px solid #333;background:#171717;color:#d6d3d1;padding:7px 10px;font-size:12px;font-weight:900;border-radius:7px}.role-switch button.active{border-color:#b28b1e;background:#d4af37;color:#17130a}.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 64px)}.side{background:#171717;color:#e7e5e4;border-right:1px solid #262626;padding:14px 10px}.who{padding:12px 12px 15px;border-bottom:1px solid #303030;margin-bottom:10px}.who .label{font-size:11px;font-weight:900;color:#a8a29e;letter-spacing:.08em}.who .name{font-size:15px;font-weight:900;margin-top:3px}.navbtn{display:flex;width:100%;align-items:center;gap:10px;border:0;border-radius:8px;background:transparent;color:#d6d3d1;text-align:left;padding:10px 11px;margin:2px 0;font-size:13px;font-weight:800}.navbtn:hover{background:#242424}.navbtn.active{background:#2d2718;color:#f6e7a8}.navbtn .dot{width:6px;height:6px;border-radius:50%;background:#57534e}.navbtn.active .dot{background:#d4af37}.content{padding:22px;max-width:1480px;width:100%}.crumb{font-size:12px;color:#78716c;font-weight:800}.page-title{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:6px 0 16px}.page-title h1{font-size:29px;line-height:1.2;margin:0}.page-title p{font-size:13px;color:#78716c;margin:0 0 3px}.bar{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #dedbd6;border-radius:11px;padding:10px 12px;margin-bottom:12px}.pill{display:inline-flex;align-items:center;border:1px solid #d6d3d1;background:#fafaf9;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900;color:#57534e}.pill.gold{border-color:#d8b449;background:#fff9e8;color:#6f520c}.pill.green{border-color:#a6d8c4;background:#effaf5;color:#11653e}.pill.red{border-color:#f2b8b5;background:#fff3f2;color:#9d1c15}.bar .spacer{flex:1}.btn{border:1px solid #a8a29e;background:#fff;color:#292524;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:900}.btn:hover{background:#f5f5f4}.btn.primary{border-color:#b28b1e;background:#d4af37;color:#17130a}.btn.dark{border-color:#333;background:#171717;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}.stat{background:#fff;border:1px solid #dedbd6;border-radius:11px;padding:14px 15px}.stat .l{font-size:11px;color:#78716c;font-weight:900;letter-spacing:.04em}.stat .v{font-size:25px;font-weight:950;margin-top:4px}.stat .s{font-size:11px;color:#78716c;margin-top:2px}.panel{background:#fff;border:1px solid #dedbd6;border-radius:11px;margin-bottom:12px;overflow:hidden}.panel-title{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid #e7e5e4;background:#fff}.panel-title h2{font-size:15px;margin:0}.panel-title p{font-size:11px;color:#78716c;margin:0}.panel-title .spacer{flex:1}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px;min-width:760px}th{text-align:left;padding:9px 12px;background:#f7f7f5;border-bottom:1px solid #d6d3d1;color:#57534e;font-size:11px;font-weight:900;white-space:nowrap}td{padding:11px 12px;border-bottom:1px solid #eee;color:#292524;vertical-align:middle}tr:last-child td{border-bottom:0}tr:hover td{background:#fcfcfb}.strong{font-weight:900}.sub{font-size:11px;color:#78716c;margin-top:2px}.amount{font-variant-numeric:tabular-nums;font-weight:900}.right{text-align:right}.empty{padding:30px;text-align:center;color:#78716c}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}.field label{display:block;font-size:11px;font-weight:900;color:#57534e;margin-bottom:5px}.field input,.field select{width:100%;border:1px solid #a8a29e;border-radius:8px;background:#fff;color:#1c1917;padding:9px 10px;font-weight:800}.actions{padding:12px 15px;border-top:1px solid #e7e5e4;background:#fafaf9;display:flex;justify-content:flex-end;gap:8px}.seat-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:11px 12px;border-bottom:1px solid #e7e5e4;background:#fafaf9}.legend{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;color:#57534e}.legend i{width:12px;height:12px;border:1px solid rgba(0,0,0,.15);display:inline-block}.seat-wrap{overflow:auto;padding:16px;background:#f5f5f4}.seat-grid{display:grid;grid-template-columns:48px repeat(12,46px);gap:4px;min-width:650px;width:max-content;margin:auto}.seat-grid .head{height:28px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#78716c;font-weight:900}.seat{height:36px;border:1px solid #c9c5bf;background:#fff;border-radius:4px;font-size:10px;font-weight:900;color:#44403c}.seat:hover{outline:2px solid #c9a227}.seat.selected{outline:3px solid #171717}.seat.player-a{background:#e7f0ff;border-color:#8bb2e8}.seat.player-b{background:#fde9ed;border-color:#e7a2ad}.seat.sponsor{background:#fff0b8;border-color:#d8b449}.seat.invite{background:#e6f6ea;border-color:#9bcaa5}.seat.ops{background:#dedede;border-color:#9e9e9e}.seat.stop{background:#2d2d2d;color:#fff;border-color:#111}.toast{position:fixed;right:20px;bottom:20px;background:#171717;color:#fff;border:1px solid rgba(201,162,39,.65);border-radius:10px;padding:11px 14px;font-size:12px;font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.28);z-index:50;opacity:0;transform:translateY(12px);pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:850px){.roles{grid-template-columns:1fr}.role{min-height:auto;border-right:0;border-bottom:1px solid #e7e5e4}.role:last-child{border-bottom:0}.role h3{margin-top:10px}.shell{grid-template-columns:1fr}.side{display:flex;overflow:auto;padding:8px;position:sticky;top:64px;z-index:15;border-right:0;border-bottom:1px solid #333}.who{display:none}.navbtn{min-width:max-content;margin:0 2px;padding:8px 10px}.content{padding:14px}.grid{grid-template-columns:1fr 1fr}.top-center{display:none}.role-switch button span{display:none}.form-row{grid-template-columns:1fr}.page-title h1{font-size:24px}}@media(max-width:520px){.grid{grid-template-columns:1fr}.top{padding:0 10px}.role-switch button{padding:7px}.content{padding:10px}.brand-body{padding:26px 18px}.surface-head,.role{padding-left:18px;padding-right:18px}}
</style>
</head>
<body>
<section id="login" class="login">
  <header class="brand"><div class="brand-top">TREASURE BOXING PROMOTION</div><div class="brand-body"><div class="small">Ticket Operations System</div><h1>チケット注文・管理システム</h1><p>選手・ジム・興行で同じ情報を確認しながら、注文から精算までを管理します。</p></div></header>
  <section class="surface"><div class="surface-head"><div class="kicker">レビュー環境</div><h2>確認する立場を選んでください</h2></div><div class="roles">
    <button class="role" onclick="enter('player')"><div class="num">01</div><h3>選手</h3><p>チケットの注文、追加・返券、購入者メモ、精算を確認します。</p><span class="arr">→</span></button>
    <button class="role" onclick="enter('gym')"><div class="num">02</div><h3>ジム担当者</h3><p>選手、注文状況、追加・返券、精算・振込を管理します。</p><span class="arr">→</span></button>
    <button class="role" onclick="enter('admin')"><div class="num">03</div><h3>興行管理者</h3><p>注文、在庫、座席、発送、精算、大会設定を管理します。</p><span class="arr">→</span></button>
  </div></section>
  <div class="review-note"><strong>レビュー用：</strong>入力不要で3役を切り替えられます。画面内の主要ボタン・ステータス変更・座席選択は確認用データ上で動作します。</div>
</section>
<section id="app" class="app hidden"><header class="top"><div class="wordmark">TREASURE TICKET</div><div class="top-center">TREASURE BOXING 14 · 後楽園ホール</div><div class="top-spacer"></div><div class="role-switch"><button data-r="player" onclick="switchRole('player')">選手 <span>レビュー</span></button><button data-r="gym" onclick="switchRole('gym')">ジム <span>レビュー</span></button><button data-r="admin" onclick="switchRole('admin')">興行 <span>レビュー</span></button></div></header><div class="shell"><aside id="side" class="side"></aside><main id="content" class="content"></main></div></section>
<div id="toast" class="toast"></div>
<script>
const state={role:'player',page:'home',orders:[{id:'TB14-0142',player:'山田 太郎',gym:'TREASURE GYM',type:'初回注文',rs:4,s:8,a:10,free:2,status:'受付済',ship:'未発送',amount:188000},{id:'TB14-0141',player:'佐藤 健',gym:'EAST GYM',type:'追加注文',rs:2,s:4,a:0,free:0,status:'確認済',ship:'準備中',amount:76000},{id:'TB14-0138',player:'田中 翼',gym:'TREASURE GYM',type:'初回注文',rs:6,s:10,a:15,free:3,status:'確認済',ship:'発送済',amount:282000}],seats:{'A-3':'player-a','A-4':'player-a','A-5':'player-a','B-5':'player-b','B-6':'player-b','C-9':'sponsor','D-2':'invite','D-3':'invite','F-11':'ops','F-12':'stop'}};
const nav={player:[['home','ホーム'],['order','チケット注文'],['requests','追加・返券'],['memos','購入者メモ'],['settle','精算']],gym:[['home','ホーム'],['players','選手一覧'],['orders','注文状況'],['requests','追加・返券'],['settle','精算'],['transfer','振込']],admin:[['home','運用ダッシュボード'],['orders','注文・在庫'],['seat','座席割当'],['shipping','発送'],['settle','精算'],['settings','設定']]};
const names={player:'山田 太郎 / TREASURE GYM',gym:'TREASURE GYM / 担当者',admin:'TREASURE BOXING PROMOTION / 管理者'};
function enter(r){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');switchRole(r)}
function switchRole(r){state.role=r;state.page='home';document.querySelectorAll('.role-switch button').forEach(b=>b.classList.toggle('active',b.dataset.r===r));render()}
function go(p){state.page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),1800)}
function render(){const s=document.getElementById('side');s.innerHTML=`<div class="who"><div class="label">ログイン中</div><div class="name">${names[state.role]}</div></div>`+nav[state.role].map(([k,l])=>`<button class="navbtn ${state.page===k?'active':''}" onclick="go('${k}')"><span class="dot"></span>${l}</button>`).join('')+`<button class="navbtn" onclick="document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')"><span class="dot"></span>ログアウト</button>`;document.getElementById('content').innerHTML=page()}
function head(title,desc){return `<div class="crumb">TREASURE BOXING 14 / ${state.role==='admin'?'興行運用':state.role==='gym'?'ジム運用':'選手運用'}</div><div class="page-title"><h1>${title}</h1><p>${desc||''}</p></div><div class="bar"><span class="pill gold">TB14</span><span class="pill green">受付中</span><span class="pill">2026.10.18 後楽園ホール</span><span class="spacer"></span><button class="btn" onclick="toast('最新状態に更新しました')">更新</button></div>`}
function stats(arr){return `<div class="grid">${arr.map(x=>`<div class="stat"><div class="l">${x[0]}</div><div class="v">${x[1]}</div><div class="s">${x[2]||''}</div></div>`).join('')}</div>`}
function ordersTable(){return `<div class="panel"><div class="panel-title"><h2>注文一覧</h2><p>大会単位の最新状態</p><span class="spacer"></span><button class="btn" onclick="toast('CSVを書き出す準備をしました')">CSV</button></div><div class="table-wrap"><table><thead><tr><th>注文番号</th><th>選手 / ジム</th><th>区分</th><th>RS</th><th>S</th><th>A</th><th>招待</th><th>受付</th><th>発送</th><th class="right">金額</th><th></th></tr></thead><tbody>${state.orders.map(o=>`<tr><td class="strong">${o.id}</td><td><div class="strong">${o.player}</div><div class="sub">${o.gym}</div></td><td>${o.type}</td><td>${o.rs}</td><td>${o.s}</td><td>${o.a}</td><td>${o.free}</td><td><span class="pill ${o.status==='受付済'?'gold':''}">${o.status}</span></td><td><span class="pill ${o.ship==='発送済'?'green':''}">${o.ship}</span></td><td class="right amount">¥${o.amount.toLocaleString()}</td><td><button class="btn" onclick="advance('${o.id}')">状態変更</button></td></tr>`).join('')}</tbody></table></div></div>`}
function advance(id){const o=state.orders.find(x=>x.id===id);if(o.ship==='未発送'){o.ship='準備中';o.status='確認済'}else if(o.ship==='準備中'){o.ship='発送済'}else{o.ship='未発送';o.status='受付済'}toast(`${id} の状態を更新しました`);render()}
function playerOrder(){return head('チケット注文','入力 → 確認 → 完了の順で注文します')+`<div class="panel"><div class="panel-title"><h2>新規注文</h2><span class="pill gold">注文締切 9/25 18:00</span></div><div class="form-row"><div class="field"><label>注文区分</label><select id="otype"><option>初回注文</option><option>追加注文</option></select></div><div class="field"><label>備考</label><input id="note" placeholder="任意"></div>${['RS席 ¥15,000','S席 ¥10,000','A席 ¥7,000','招待券 ¥0'].map((x,i)=>`<div class="field"><label>${x}</label><input id="q${i}" type="number" min="0" value="${i===0?2:i===1?4:0}"></div>`).join('')}</div><div class="actions"><button class="btn" onclick="toast('入力内容を保存しました')">下書き保存</button><button class="btn primary" onclick="submitOrder()">注文を確定する</button></div></div>`+ordersTable()}
function submitOrder(){const qs=[0,1,2,3].map(i=>Math.max(0,Number(document.getElementById('q'+i)?.value||0)));const amount=qs[0]*15000+qs[1]*10000+qs[2]*7000;const id='TB14-'+String(143+state.orders.length).padStart(4,'0');state.orders.unshift({id,player:'山田 太郎',gym:'TREASURE GYM',type:document.getElementById('otype').value,rs:qs[0],s:qs[1],a:qs[2],free:qs[3],status:'受付済',ship:'未発送',amount});toast(`${id} を受け付けました`);render()}
function seatMap(){let out=head('座席割当','Excelのように座席を選び、選手・用途へ割り当てます');out+=`<div class="panel"><div class="seat-tools"><button class="btn primary" onclick="assignSelected('player-a')">山田 太郎へ割当</button><button class="btn" onclick="assignSelected('sponsor')">スポンサー席</button><button class="btn" onclick="assignSelected('invite')">招待席</button><button class="btn dark" onclick="assignSelected('stop')">販売停止</button><button class="btn" onclick="clearSelected()">解除</button><span style="flex:1"></span><span class="legend"><i style="background:#e7f0ff"></i>山田</span><span class="legend"><i style="background:#fde9ed"></i>佐藤</span><span class="legend"><i style="background:#fff0b8"></i>スポンサー</span><span class="legend"><i style="background:#e6f6ea"></i>招待</span><span class="legend"><i style="background:#dedede"></i>運営</span></div><div class="seat-wrap"><div class="seat-grid"><div class="head"></div>${Array.from({length:12},(_,i)=>`<div class="head">${i+1}</div>`).join('')}`;for(const row of ['A','B','C','D','E','F','G','H']){out+=`<div class="head">${row}</div>`;for(let i=1;i<=12;i++){const k=`${row}-${i}`,cl=state.seats[k]||'';out+=`<button class="seat ${cl}" data-seat="${k}" onclick="this.classList.toggle('selected')">${i}</button>`}}out+=`</div></div></div><div class="panel"><div class="panel-title"><h2>割当履歴</h2></div><div class="table-wrap"><table><thead><tr><th>時刻</th><th>操作</th><th>座席</th><th>対象</th><th>操作者</th></tr></thead><tbody><tr><td>14:32</td><td>割当</td><td>A-3〜A-5</td><td>山田 太郎</td><td>興行管理者</td></tr><tr><td>14:18</td><td>予約</td><td>C-9</td><td>スポンサー</td><td>興行管理者</td></tr></tbody></table></div></div>`;return out}
function assignSelected(type){document.querySelectorAll('.seat.selected').forEach(el=>{state.seats[el.dataset.seat]=type;el.className='seat '+type});toast('選択座席を更新しました')}
function clearSelected(){document.querySelectorAll('.seat.selected').forEach(el=>{delete state.seats[el.dataset.seat];el.className='seat'});toast('選択座席を解除しました')}
function settings(){return head('設定','運用・精算・大会・ジム/選手・会社設定を整理しています')+`<div class="panel"><div class="panel-title"><h2>チケット運用</h2><span class="pill gold">重要</span></div><div class="form-row"><div class="field"><label>注文締切</label><input value="2026-09-25 18:00"></div><div class="field"><label>追加注文締切</label><input value="2026-10-09 18:00"></div><div class="field"><label>返券申告締切</label><input value="2026-10-12 18:00"></div><div class="field"><label>現物返券受渡日</label><input value="2026-10-15"></div></div><div class="actions"><button class="btn primary" onclick="toast('設定を保存しました')">保存</button></div></div><div class="panel"><div class="panel-title"><h2>大会設定</h2></div><div class="form-row"><div class="field"><label>大会名</label><input value="TREASURE BOXING 14"></div><div class="field"><label>会場</label><input value="後楽園ホール"></div><div class="field"><label>開催日</label><input value="2026-10-18"></div><div class="field"><label>状態</label><select><option>受付中</option><option>停止</option></select></div></div><div class="actions"><button class="btn primary" onclick="toast('大会設定を保存しました')">保存</button></div></div>`}
function generic(title){return head(title,'TREASURE BOXING 14 のレビュー用データ')+stats([['対象件数','12','大会内の対象'],['対応待ち','3','要アクション'],['完了','9','処理済み'],['更新','14:32','最終更新']])+ordersTable()}
function page(){if(state.role==='player'){if(state.page==='order')return playerOrder();if(state.page==='home')return head('選手ホーム','注文状況と次の作業を確認します')+stats([['注文合計','24枚','RS 4 / S 8 / A 10 / 招待 2'],['売上見込','¥188,000','購入者メモ反映前'],['追加・返券','受付中','次回締切 10/09'],['精算','未確定','興行終了後に確定']])+ordersTable();return generic(nav.player.find(x=>x[0]===state.page)?.[1]||'選手メニュー')}if(state.role==='gym'){if(state.page==='home')return head('ジムホーム','所属選手の注文・返券・精算をまとめて確認します')+stats([['所属選手','8名','承認済み'],['注文合計','62枚','3選手から注文'],['対応待ち','2件','返券確認 1 / 振込 1'],['精算見込','¥486,000','大会終了前の見込']])+ordersTable();return generic(nav.gym.find(x=>x[0]===state.page)?.[1]||'ジムメニュー')}if(state.page==='seat')return seatMap();if(state.page==='settings')return settings();if(state.page==='home')return head('運用ダッシュボード','注文から精算まで、大会ごとの要対応を確認します')+stats([['注文','18件','合計 246枚'],['要対応','5件','注文 2 / 返券 1 / ジム 2'],['発送','14/18','4件が未発送'],['売上見込','¥1,964,000','取消を除く']])+ordersTable();return generic(nav.admin.find(x=>x[0]===state.page)?.[1]||'興行メニュー')}
